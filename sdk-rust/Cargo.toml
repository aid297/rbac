[package]
name = "rbac-sdk-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Official Rust client SDK for the rbac authorization microservice /v1 API (HTTP + gRPC)"
license = "MIT"
repository = "https://github.com/aid297/rbac"
readme = "README.md"
keywords = ["rbac", "authorization", "acl", "grpc"]
categories = ["api-bindings", "authentication"]

[lib]
name = "rbac"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
tower = "0.5"
url = "2"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
