[package]
name = "rbac-sdk-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Official Rust client SDK for the rbac authorization microservice /v1 API"
license = "MIT"
repository = "https://github.com/aid297/rbac"
readme = "README.md"
keywords = ["rbac", "authorization", "acl"]
categories = ["api-bindings", "authentication"]

[lib]
name = "rbac"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
mockito = "1"
