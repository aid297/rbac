# Demo config — HTTP only, no encryption, no cache.
# Used by demo-go / demo-rust / demo-csharp functional tests.

policy:
  dir: demo/data
  encrypt: false
  crypto: aes-256-gcm
  key:

ca:
  dir: secret

cache:
  enable: false
  kind: redis
  addr: 127.0.0.1:6379
  password:
  db: 0

server:
  http:
    enable: true
    host: 127.0.0.1
    port: 8080
  https:
    enable: false
    port: 8443

admin:
  enable: false
  username: admin
  password: admin
  host: 127.0.0.1
  port: 9090
